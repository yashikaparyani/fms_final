# IC agreement form — served on the server's bare IP only, not on bestloaders.com.
# Installed as /etc/nginx/conf.d/ic-agreement.conf. bestloaders.com keeps its own
# server blocks in fmss.conf; this one only answers requests that name no known host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3.217.68.179;

    root /var/www/ic-agreement;

    location = / { return 302 /ic-agreement/; }

    location /ic-agreement/ {
        alias /var/www/ic-agreement/;
        index index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location / { return 404; }
}
